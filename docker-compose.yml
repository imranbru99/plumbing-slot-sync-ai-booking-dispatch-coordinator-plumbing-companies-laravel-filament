services:
  app:
    build: .
    container_name: plumbingslotsync_app
    ports:
      - "8114:8000"
    environment:
      APP_NAME: PlumbingSlotSync
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8114
      APP_KEY: ${APP_KEY:-base64:KHkXsEgGKOhkcSTq1CIhjdF2nkFioJClXJst3jpPzFI=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: plumbingslotsync
      DB_USERNAME: plumbing
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: plumbingslotsync_mysql
    environment:
      MYSQL_DATABASE: plumbingslotsync
      MYSQL_USER: plumbing
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33074:3306"
    volumes:
      - plumbingslotsync_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: plumbingslotsync_redis
    ports:
      - "63804:6379"
    restart: unless-stopped

volumes:
  plumbingslotsync_mysql_data:
